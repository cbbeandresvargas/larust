<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Larust App{% endblock %}</title>
    
    <!-- CSS de Tailwind -->
    <link rel="stylesheet" href="/static/css/output.css">
    <!-- HTMX Local -->
    <script src="/static/js/htmx.min.js" defer></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <header class="p-4 bg-slate-800 border-b border-slate-700">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-xl font-bold text-orange-500">Larust 🦀</a>
            <nav class="flex items-center gap-4 text-sm text-slate-300">
                <a href="/users" class="hover:text-orange-400 transition">Usuarios</a>
                <a href="/uploads" class="hover:text-orange-400 transition">Archivos</a>
                <a href="/login" class="hover:text-orange-400 transition">Iniciar sesión</a>
                <a href="/register" class="hover:text-orange-400 transition">Registrarse</a>
                <form method="post" action="/logout">
                    <button type="submit" class="hover:text-orange-400 transition">Cerrar sesión</button>
                </form>
            </nav>
        </div>
    </header>

    <main class="container mx-auto p-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
